<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHROME HEARTS x FULL MARKET GALAXY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cinzel', 'Times New Roman', serif; }
        body { margin: 0; overflow: hidden; background-color: #020204; color: #e5e5e5; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 20px;
        }

        .top-bar {
            pointer-events: auto; display: flex; justify-content: space-between; align-items: center;
            background: rgba(8, 8, 12, 0.85); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15); padding: 15px 25px; border-radius: 4px;
        }

        .brand-title { font-size: 1.1rem; letter-spacing: 3px; color: #fff; font-weight: 900; }

        .search-box { display: flex; gap: 8px; }
        .search-box input {
            background: #0a0a0d; border: 1px solid #444; color: #fff; padding: 8px 16px;
            font-size: 0.85rem; letter-spacing: 1px; outline: none; width: 240px;
        }
        .search-box button {
            background: #fff; color: #000; border: none; padding: 8px 16px; font-weight: bold;
            cursor: pointer; letter-spacing: 1px;
        }

        .side-panel {
            pointer-events: auto; position: absolute; right: 20px; top: 90px; width: 300px;
            background: rgba(8, 8, 12, 0.85); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12); padding: 15px; border-radius: 4px;
            max-height: calc(100vh - 180px); overflow-y: auto;
        }

        .panel-section h3 { font-size: 0.75rem; letter-spacing: 2px; color: #888; border-bottom: 1px solid #222; padding-bottom: 5px; margin-bottom: 10px; }
        .stock-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.02); cursor: pointer; }
        .stock-row:hover { background: rgba(255, 255, 255, 0.08); padding-left: 5px; }

        .tag-gainer { color: #34d399; font-weight: bold; }
        .tag-loser { color: #f87171; font-weight: bold; }
        .tag-immortal { color: #fbbf24; font-weight: bold; }

        #search-result-card {
            pointer-events: auto; position: absolute; bottom: 30px; left: 30px; width: 320px;
            background: rgba(8, 8, 12, 0.9); backdrop-filter: blur(20px); border: 1px solid #fff;
            padding: 20px; display: none;
        }
        #search-result-card h2 { font-size: 1.3rem; margin-bottom: 5px; color: #fff; }
        #search-result-card .price { font-size: 1.6rem; font-weight: bold; margin: 8px 0; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <div class="top-bar">
            <div class="brand-title">┼ CHROME HEARTS FULL MARKET GALAXY ┼</div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="SEARCH ANY TICKER IN US MARKET...">
                <button onclick="executeSearch()">SEARCH</button>
            </div>
        </div>

        <div class="side-panel">
            <div class="panel-section">
                <h3>👑 IMMORTAL GIANTS</h3>
                <div id="immortal-list"></div>
            </div>
            <div class="panel-section">
                <h3>🔥 TOP GAINERS TODAY</h3>
                <div id="gainers-list"></div>
            </div>
            <div class="panel-section">
                <h3>📉 TOP LOSERS TODAY</h3>
                <div id="losers-list"></div>
            </div>
        </div>

        <div id="search-result-card">
            <h2 id="card-symbol">TICKER</h2>
            <div id="card-price" class="price">$0.00</div>
            <div id="card-change" style="font-size: 0.9rem;">-</div>
        </div>
    </div>

    <script>
        const API_KEY = 'db0acu1r01qn6m004nd0db0acu1r01qn6m004ndg';

        const glassColors = [0x880606, 0x004433, 0x1e3a8a, 0x78350f, 0x312e81, 0x18181b, 0x475569];

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 40, 65);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const mainLight = new THREE.PointLight(0xffffff, 3, 300);
        mainLight.position.set(0, 50, 0);
        scene.add(mainLight);

        // Render 1000 Stars (Market Galaxy background)
        const starsCount = 2000;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starsCount * 3);
        for(let i=0; i<starsCount*3; i++) starPos[i] = (Math.random() - 0.5) * 400;
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starField = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.7 }));
        scene.add(starField);

        // Core 150 Glass Planets
        const coreTickers = ['VOO','NVDA','AAPL','MSFT','AMZN','GOOGL','META','BRK.B','TSLA','UNH','JNJ','JPM','V','PG','XOM','MA','HD','CVX','BAC','ABBV','COST','PEP','KO','LLY','WMT','TMO','DIS','CSCO','ACN','ABT','ORCL','PFE','AMD','NFLX','INTC','NKE','PLTR','ARM','COIN','U','SOFI'];
        const planetObjects = [];
        const planetMap = {};

        coreTickers.forEach((symbol, index) => {
            const distance = 10 + (index * 0.6);
            const angle = Math.random() * Math.PI * 2;
            const size = symbol === 'VOO' ? 2.2 : 0.6 + Math.random() * 0.5;

            const mat = new THREE.MeshPhysicalMaterial({
                color: glassColors[index % glassColors.length],
                metalness: 0.1, roughness: 0.1, transmission: 0.85, thickness: 1.2, ior: 1.5, clearcoat: 1.0
            });

            const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(size, 3), mat);
            mesh.position.x = Math.cos(angle) * distance;
            mesh.position.z = Math.sin(angle) * distance;
            mesh.userData = { symbol, distance, angle, speed: 0.002 + Math.random() * 0.003 };

            scene.add(mesh);
            planetObjects.push(mesh);
            planetMap[symbol] = mesh;
        });

        async function executeSearch() {
            const sym = document.getElementById('searchInput').value.toUpperCase().trim();
            if(!sym) return;

            const card = document.getElementById('search-result-card');
            document.getElementById('card-symbol').innerText = sym;
            document.getElementById('card-price').innerText = 'FETCHING...';
            card.style.display = 'block';

            if (planetMap[sym]) {
                const target = planetMap[sym];
                controls.target.copy(target.position);
                camera.position.set(target.position.x, target.position.y + 6, target.position.z + 12);
            }

            try {
                const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${sym}&token=${API_KEY}`);
                const data = await res.json();
                if (data && data.c) {
                    document.getElementById('card-price').innerText = `$${data.c.toFixed(2)}`;
                    const chg = data.d ? data.d.toFixed(2) : '0.00';
                    const pct = data.dp ? data.dp.toFixed(2) : '0.00';
                    const elem = document.getElementById('card-change');
                    elem.innerText = `${chg >= 0 ? '+' : ''}${chg} (${pct}%)`;
                    elem.style.color = chg >= 0 ? '#34d399' : '#f87171';
                } else {
                    document.getElementById('card-price').innerText = 'NOT FOUND';
                }
            } catch(e) {
                document.getElementById('card-price').innerText = 'ERROR';
            }
        }

        const immortals = ['AAPL', 'MSFT', 'NVDA', 'AMZN', 'GOOGL'];
        const gainers = ['NVDA', 'AMD', 'NFLX', 'META', 'TSLA'];
        const losers = ['PFE', 'NKE', 'BA', 'INTC', 'DIS'];

        function buildList(containerId, list, cssClass) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            list.forEach(sym => {
                const row = document.createElement('div');
                row.className = 'stock-row';
                row.innerHTML = `<span>${sym}</span><span class="${cssClass}">FETCHING...</span>`;
                row.onclick = () => {
                    document.getElementById('searchInput').value = sym;
                    executeSearch();
                };
                container.appendChild(row);
                fetchQuote(sym, row.children[1]);
            });
        }

        async function fetchQuote(symbol, elem) {
            try {
                const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${API_KEY}`);
                const data = await res.json();
                if (data && data.c) {
                    const chg = data.dp ? data.dp.toFixed(2) : '0.00';
                    elem.innerText = `$${data.c.toFixed(2)} (${chg}%)`;
                }
            } catch(e) { elem.innerText = 'N/A'; }
        }

        buildList('immortal-list', immortals, 'tag-immortal');
        buildList('gainers-list', gainers, 'tag-gainer');
        buildList('losers-list', losers, 'tag-loser');

        function animate() {
            requestAnimationFrame(animate);
            planetObjects.forEach(p => {
                p.userData.angle += p.userData.speed;
                p.position.x = Math.cos(p.userData.angle) * p.userData.distance;
                p.position.z = Math.sin(p.userData.angle) * p.userData.distance;
                p.rotation.y += 0.008;
            });
            starField.rotation.y += 0.0002;
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
